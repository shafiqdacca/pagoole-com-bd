<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagoole Style Website</title>

<style>
:root {
    --primary: #2563eb;
    --dark: #0f172a;
    --light: #f8fafc;
    --gray: #64748b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--light);
    color: var(--dark);
}

/* ===== NAVBAR ===== */
header {
    position: fixed;
    top: 0;
    width: 100%;
    background: white;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    z-index: 999;
}

.nav {
    max-width: 1200px;
    margin: auto;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 1.6rem;
    font-weight: bold;
    color: var(--primary);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.nav-links a {
    margin-left: 25px;
    font-weight: 500;
}

.nav-links a:hover {
    color: var(--primary);
}

/* ===== APP BUTTON ===== */
.app-menu {
    position: relative;
}

.menu-button {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
}

.menu-button:hover {
    background: #f1f5f9;
}

.menu-button svg {
    width: 24px;
    height: 24px;
    fill: var(--dark);
}

/* ===== APP LIST POPUP ===== */
.app-list {
    position: absolute;
    top: 48px;
    right: 0;
    width: 320px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 20px 45px rgba(0,0,0,.18);
    padding: 18px;
    display: none;
    animation: popup .2s ease;
}

@keyframes popup {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
}

.my-apps {
    font-size: 1.1rem;
    margin-bottom: 15px;
    font-weight: 600;
}

.app-section {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.app-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px;
    border-radius: 14px;
    cursor: pointer;
    transition: .25s;
    text-align: center;
}

.app-card img {
    width: 42px;
    height: 42px;
    object-fit: contain;
}

.app-card span {
    font-size: .9rem;
    font-weight: 500;
}

.app-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(0,0,0,.15);
}

.gray { background: #f1f5f9; }
.red { background: #fee2e2; }
.lightgreen { background: #dcfce7; }
.green { background: #bbf7d0; }

/* ===== HERO ===== */
.hero {
    padding-top: 120px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    background: linear-gradient(to right, #eff6ff, #ffffff);
}

.hero-content {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
}

.hero h1 {
    font-size: 3.2rem;
    margin-bottom: 20px;
}

.hero p {
    font-size: 1.2rem;
    color: var(--gray);
    margin-bottom: 30px;
}

.btn {
    display: inline-block;
    padding: 14px 32px;
    background: var(--primary);
    color: white;
    border-radius: 50px;
    font-weight: bold;
}

.hero img {
    width: 100%;
}

/* ===== FOOTER ===== */
footer {
    background: #020617;
    color: #94a3b8;
    text-align: center;
    padding: 30px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
    .hero-content {
        grid-template-columns: 1fr;
        text-align: center;
    }
    .nav-links {
        display: none;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header>
    <div class="nav">
        <div class="logo">Pagoole</div>

        <div class="nav-right">
            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#services">Services</a>
                <a href="#about">About</a>
                <a href="#portfolio">Portfolio</a>
                <a href="#contact">Contact</a>
            </div>

            <!-- APP MENU -->
            <div class="app-menu">
                <button class="menu-button" id="appBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M18.5 1A1.5 1.5 0 0 0 17 2.5v3A1.5 1.5 0 0 0 18.5 7h3A1.5 1.5 0 0 0 23 5.5v-3A1.5 1.5 0 0 0 21.5 1h-3zM18.5 9a1.5 1.5 0 0 0-1.5 1.5v3a1.5 1.5 0 0 0 1.5 1.5h3a1.5 1.5 0 0 0 1.5-1.5v-3A1.5 1.5 0 0 0 21.5 9h-3zM2.5 17A1.5 1.5 0 0 0 1 18.5v3A1.5 1.5 0 0 0 2.5 23h3A1.5 1.5 0 0 0 7 21.5v-3A1.5 1.5 0 0 0 5.5 17h-3z"></path>
                    </svg>
                </button>

                <div role="menu" class="app-list" id="appList">
                    <h2 class="my-apps">My Applications</h2>
                    <div class="app-section">
                        <div class="app-card gray"><img src="/pagoole-p-round-with-name.png"><span>Pagoole Home</span></div>
                        <div class="app-card red"><img src="/user-avater.jpg"><span>My Account Center</span></div>
                        <div class="app-card lightgreen"><img src="/pagoole-discount-logo128x128.png"><span>Pagoole Discount Shop</span></div>
                        <div class="app-card green"><img src="/pagoole-report-project.png"><span>Dynamic Solution</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- HERO -->
<section id="home" class="hero">
    <div class="hero-content">
        <div>
            <h1>Build Your Digital Presence</h1>
            <p>Clean, modern and high-converting websites for your brand and business.</p>
            <a href="#contact" class="btn">Get Started</a>
        </div>
        <img src="https://via.placeholder.com/500x400">
    </div>
</section>

<footer>
    © 2026 Pagoole Style Website. All Rights Reserved.
</footer>

<script>
const appBtn = document.getElementById("appBtn");
const appList = document.getElementById("appList");

appBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    appList.style.display =
        appList.style.display === "block" ? "none" : "block";
});

document.addEventListener("click", () => {
    appList.style.display = "none";
});
</script>

</body>
</html>
